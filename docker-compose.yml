version: '3.8'

services:
  trustlens-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustlens_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=sqlite:////app/data/trustlens.db
      - LLM_PROVIDER=auto
    volumes:
      # Durable volume for persistent SQLite database across container restarts
      - trustlens_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  trustlens_data:
    driver: local
